name: ci

on:
  push:
  pull_request:

jobs:
  lamedh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lamedh release
        run: scripts/bootstrap-lamedh.sh
      - name: Format check
        run: find src tests examples -type f -name '*.lisp' -print0 | sort -z | xargs -0 .tools/bin/lamedh --fmt-check
      - name: Static check
        run: .tools/bin/lamedh --check src/core.lisp src/surface.lisp src/profile.lisp src/elaborate.lisp src/plan.lisp src/prompt.lisp src/candidate.lisp src/transition.lisp src/platform.lisp src/recipe.lisp src/runner.lisp src/verify.lisp src/cache.lisp src/assembly.lisp src/adequacy.lisp src/serialize.lisp
      - name: Lisp tests
        run: .tools/bin/lamedh --test tests
      - name: Elaborate Todo
        run: bin/gymnast check examples/todo.lisp todo-spec
      - name: Reproducible compilation
        run: |
          bin/gymnast compile examples/todo.lisp todo-spec build/one
          bin/gymnast compile examples/todo.lisp todo-spec build/two
          diff -ru build/one build/two

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Build (warnings are errors)
        run: cargo build --all-targets
        env:
          RUSTFLAGS: -D warnings
      - name: Tests
        run: cargo test
      - name: Check todo.gym fixture
        run: cargo run -- check ../examples/todo.gym
      - name: Reject a known-bad spec
        run: |
          printf 'spec t = v 0.1 owner o exports A\n\nmode A = struct (Missing x)\n' > /tmp/bad.gym
          if cargo run -- check /tmp/bad.gym; then
            echo "check accepted a spec with an unknown mode" >&2; exit 1
          fi
      - name: Reproducible IR
        run: |
          cargo run -- ir ../examples/todo.gym > /tmp/ir-one.sexpr
          cargo run -- ir ../examples/todo.gym > /tmp/ir-two.sexpr
          diff /tmp/ir-one.sexpr /tmp/ir-two.sexpr
          diff /tmp/ir-one.sexpr tests/fixtures/todo-ir.sexpr
